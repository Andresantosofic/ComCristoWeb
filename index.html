<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/images/LogoComCristo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10245b" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Com Cristo"
    />

    <meta
      name="description"
      content="Bíblia, devocional e conteúdo cristão no Com Cristo."
    />

    <title>Com Cristo</title>

    <style>
      /* Tela de abertura */
      #splash-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #10245b;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      #splash-screen img {
        width: 180px;
        height: 180px;
        object-fit: contain;
      }

      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- Splash inicial -->
    <div id="splash-screen">
      <img
        src="/images/logo_feed_perfil.png"
        alt="Com Cristo"
      />
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          const splash = document.getElementById("splash-screen");

          if (splash) {
            splash.classList.add("hidden");

            setTimeout(function () {
              splash.remove();
            }, 400);
          }
        }, 300);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

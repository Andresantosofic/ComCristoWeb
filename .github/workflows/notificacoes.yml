name: Notificações diárias

on:
  schedule:
    - cron: "2/5 * * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:
    inputs:
      forcar_envio:
        description: "Forçar envio mesmo se já houver envio hoje"
        required: false
        type: boolean
        default: false

concurrency:
  group: notificacoes-diarias
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix scripts

            - name: Enviar notificações
        run: |
          echo "=========================================="
          echo "INICIANDO SCRIPT DE NOTIFICAÇÕES"
          echo "FORCAR_ENVIO=$FORCAR_ENVIO"
          echo "=========================================="

          echo "TESTE 1 - Node:"
          node --version

          echo "TESTE 2 - Arquivo:"
          ls -l scripts/enviar-notificacoes.mjs

          echo "TESTE 3 - Sintaxe:"
          node --check scripts/enviar-notificacoes.mjs

          echo "TESTE 4 - EXECUÇÃO:"
          node scripts/enviar-notificacoes.mjs

          echo "=========================================="
          echo "SCRIPT FINALIZADO"
          echo "=========================================="
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FORCAR_ENVIO: ${{ inputs.forcar_envio }}
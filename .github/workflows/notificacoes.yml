name: Notificações diárias

on:
  schedule:
    - cron: "2/5 * * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:
    inputs:
      forcar_envio:
        description: "Forcar envio mesmo se ja houver envio hoje"
        required: false
        type: boolean
        default: false

concurrency:
  group: notificacoes-diarias
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix scripts

      - name: Enviar notificacoes
        run: node scripts/enviar-notificacoes.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FORCAR_ENVIO: ${{ inputs.forcar_envio }}